name: Weekly subscriber email

on:
  schedule:
    - cron: "0 18 * * 0"   # Monday 7am NZDT
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the email (and save it in Buttondown if a key is set)
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DIGEST_MODE: ${{ vars.DIGEST_MODE || 'draft' }}
        run: python3 scripts/send_digest.py
      - uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: out/
          if-no-files-found: ignore
      - name: Remember when we last sent
        run: |
          git config user.name "puna-checker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push
