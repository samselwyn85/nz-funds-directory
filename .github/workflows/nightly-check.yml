name: Nightly fund check

on:
  schedule:
    - cron: "0 14 * * *"   # 3am NZDT / 2am NZST every night
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every funder page
        run: python3 scripts/check_funds.py
      - name: Save updated listings
        run: |
          git config user.name "puna-checker"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/feed.xml data
          git diff --cached --quiet || git commit -m "Nightly check $(date -u +%F)"
          git push
