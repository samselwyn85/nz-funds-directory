<style>
/* Layout: sticky search header, chip filter row, card list; detail and matcher as hash views */
:root{
  --bg:#f6f8f6; --surface:#ffffff; --fg:#14211d; --muted:#5b6b65; --line:#dbe3df;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#e2f1ec;
  --kowhai:#f2c230; --kowhai-soft:#fdf3cf; --kowhai-ink:#5a4300;
  --ok:#1f7a45; --warn:#a35b00; --bad:#b42318;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --fg:#e6eeea; --muted:#9db0a8; --line:#28362f;
  --accent:#4cc3a3; --accent-ink:#06231b; --accent-soft:#173b31;
  --kowhai:#f2c230; --kowhai-soft:#3a3115; --kowhai-ink:#f7dc84;
  --ok:#5fd08f; --warn:#f0a94a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --fg:#e6eeea; --muted:#9db0a8; --line:#28362f;
  --accent:#4cc3a3; --accent-ink:#06231b; --accent-soft:#173b31;
  --kowhai:#f2c230; --kowhai-soft:#3a3115; --kowhai-ink:#f7dc84;
  --ok:#5fd08f; --warn:#f0a94a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--kowhai);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:700;font-size:1.2rem}
.brand svg{flex:none}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--fg);padding:8px 12px;border-radius:999px;font-weight:500;font-size:.95rem}
nav.main a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.main a.cta{background:var(--accent);color:var(--accent-ink)}

.hero{padding-block:36px 20px}
.hero h1{font-size:clamp(1.9rem,4.5vw,3rem);font-weight:700;max-width:20ch}
.hero p.lede{color:var(--muted);max-width:60ch;margin:10px 0 0;font-size:1.05rem}
.search{margin-top:22px;display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;align-items:center;max-width:720px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.05rem;color:var(--fg);padding:10px 0}
.search input:focus{outline:none}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.92rem}
.facts b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.chip{position:relative}
.chip>button{font:inherit;font-size:.92rem;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip>button[aria-expanded="true"],.chip.on>button{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .count{font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:0 7px;font-weight:600}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,30,25,.16);padding:8px;min-width:240px;max-height:340px;overflow:auto}
.menu label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.95rem}
.menu label:hover{background:var(--accent-soft)}
.menu label span.n{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.menu input{accent-color:var(--accent);width:16px;height:16px}
select#sort{font:inherit;font-size:.92rem;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;margin-left:auto}
.applied{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:10px}
.applied:empty{display:none}
.tagx{font:inherit;font-size:.85rem;border:0;background:var(--fg);color:var(--bg);border-radius:999px;padding:4px 10px;cursor:pointer}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer}

.seg{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px;gap:0;max-width:860px;box-shadow:0 8px 24px rgba(10,40,32,.06)}
.seg label{display:grid;gap:0;padding:6px 14px;border-right:1px solid var(--line);min-width:0}
.seg label:nth-child(3){border-right:0}
.seg label span{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg input,.seg select{border:0;background:transparent;font:inherit;font-size:1rem;color:var(--fg);padding:2px 0;min-width:0;width:100%}
.seg input:focus,.seg select:focus{outline:none}
.seg label:focus-within{background:var(--accent-soft);border-radius:10px}
.seg .btn{border-radius:12px;padding:12px 20px}
.shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sc{font:inherit;font-size:.9rem;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 12px;cursor:pointer}
.sc b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.sc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sc[aria-pressed="true"] b{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:2.5px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button b{font-weight:600;font-variant-numeric:tabular-nums;font-size:.8rem;margin-left:4px;color:var(--muted)}
.card{position:relative}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.save{position:absolute;top:12px;right:12px;z-index:1;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;display:grid;place-items:center}
.save[aria-pressed="true"]{color:var(--bad);border-color:var(--bad)}
.card .meta:first-child{padding-right:44px}
.fbtn{display:none}
.tabbar{display:none}
.feed{display:grid;gap:8px;margin:0 0 18px;padding:14px 16px;background:var(--kowhai-soft);border-radius:var(--r);font-size:.92rem}
.feed b{color:var(--kowhai-ink)}
.resultbar{display:flex;justify-content:space-between;align-items:baseline;padding-block:6px 12px;color:var(--muted);font-size:.92rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg);min-width:0;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h3{font-size:1.12rem;font-weight:700}
.card .by{color:var(--muted);font-size:.9rem;margin-top:-6px}
.card p{margin:0;font-size:.94rem;color:var(--fg)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;border-radius:999px;padding:3px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.type{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.pill.soon{background:var(--kowhai-soft);border-color:transparent;color:var(--kowhai-ink);font-weight:600}
.pill.anytime{background:transparent;border-color:var(--accent);color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.moved{background:var(--warn)} .dot.broken{background:var(--bad)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

.detail{padding-block:28px 56px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px}
.detail h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.detail .back{font-size:.92rem;display:inline-block;margin-bottom:14px}
.facts-table{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;margin:22px 0;font-size:.96rem}
.facts-table dt{color:var(--muted)} .facts-table dd{margin:0}
aside.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.note{font-size:.88rem;color:var(--muted);background:var(--kowhai-soft);border-radius:8px;padding:10px 12px}

.page{padding-block:32px 56px;max-width:760px}
.page h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.page p{max-width:65ch}
.steps{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.step h2{font-size:1.15rem;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
form.sub{display:grid;gap:14px;margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
form.sub label.f{display:grid;gap:6px;font-weight:600;font-size:.94rem}
form.sub input[type=email],form.sub select{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem;cursor:pointer}
.checks input{accent-color:var(--accent)}
.ok-msg{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:12px 14px}
.compare{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:14px}
.compare th,.compare td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.compare td.y{color:var(--ok);font-weight:600}
.tablewrap{overflow-x:auto}
footer.site{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.88rem}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plan.best{border:2px solid var(--accent)}
.plan h2{font-size:1.2rem}
.price{font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.94rem}
.plan .btn{justify-content:center;margin-top:auto}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;margin-top:16px;background:var(--surface)}
.toggle button{font:inherit;border:0;background:none;color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.paywith{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.88rem;margin-top:18px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,20,16,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet>div{background:var(--surface);color:var(--fg);border-radius:16px;padding:22px;max-width:440px;width:100%;display:grid;gap:12px}
.paybtn{font:inherit;font-weight:600;border-radius:10px;padding:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.paybtn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (min-width:700px){.sheet{align-items:center}}
@media (max-width:900px){
  .detail{grid-template-columns:1fr}
  aside.panel{position:static}
}
@media (max-width:760px){
  .seg{grid-template-columns:1fr 1fr;border-radius:14px}
  .seg label:first-child{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
  .seg label:nth-child(2){border-right:1px solid var(--line)}
  .seg .btn{grid-column:1/-1;justify-content:center;margin-top:6px}
  .shortcuts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .sc{white-space:nowrap}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip>button{white-space:nowrap}
  .facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:10px;font-size:.78rem}
  .facts b{font-size:1.2rem}
  nav.main{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500;padding:4px 0;border-radius:10px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  nav.main{margin-left:0;width:100%}
  select#sort{margin-left:0}
  .facts-table{grid-template-columns:1fr;gap:2px}
  .facts-table dd{margin-bottom:10px}
  .menu{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:60vh}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<script>
(function(){
const CONFIG = Object.assign({ buttondownUser: "" }, window.PUNA_CONFIG || {});
const SECTORS = ["Community","Arts & culture","Sport & recreation","Environment","Māori & iwi","Education & youth","Health & wellbeing","Business & innovation","Heritage","Media"];
const REGIONS = ["Northland","Auckland","Waikato","Bay of Plenty","Gisborne","Hawke's Bay","Taranaki","Manawatū-Whanganui","Wellington","Tasman","Nelson","Marlborough","West Coast","Canterbury","Otago","Southland","Chatham Islands"];
const TYPES = ["Government","Gaming trust","Community trust","Philanthropic","Council","Corporate"];
const WHEN = ["Open anytime","Set rounds","Closing in 30 days","Check funder"];
const WHO = ["Community groups","Charities","Marae, iwi & hapū","Schools","Businesses","Individuals"];

let DATA = {updated:null, funds:[]};
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("puna-saved") || "[]")); } catch(_) {}
function persistSaved(){ try { localStorage.setItem("puna-saved", JSON.stringify([...saved])); } catch(_) {} }
const TABS = [["all","All funds"],["anytime","Apply anytime"],["soon","Closing soon"],["changed","Recently changed"],["saved","Saved"]];
function recent(f){ const h=(f.history||[]).at(-1); return h && (Date.now()-new Date(h.date))/864e5 <= 14; }
function inTab(f, tab){
  if (tab==="anytime") return f.howToApply==="Open anytime";
  if (tab==="soon"){ const d=daysUntil(f.nextDeadline); return d!==null && d>=0 && d<=45; }
  if (tab==="changed") return recent(f);
  if (tab==="saved") return saved.has(f.id);
  return true;
}
const state = { tab:"all", q:"", sector:new Set(), region:new Set(), type:new Set(), when:new Set(), who:new Set(), sort:"relevance", open:null };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function daysUntil(d){ if(!d) return null; const t = new Date(d+"T23:59:59+13:00"); return Math.ceil((t - Date.now())/864e5); }
function whenOf(f){
  const d = daysUntil(f.nextDeadline);
  if (d !== null && d >= 0 && d <= 30) return "Closing in 30 days";
  return f.howToApply;
}
function ago(iso){
  if(!iso) return null;
  const h = Math.round((Date.now() - new Date(iso))/36e5);
  if (h < 1) return "just now"; if (h < 24) return h+"h ago";
  const d = Math.round(h/24); return d === 1 ? "yesterday" : d+" days ago";
}
function linkLine(f){
  const a = ago(f.lastChecked);
  if (!a) return `<span><span class="dot"></span>First check tonight</span>`;
  const label = {ok:"Link working", moved:"Page moved", broken:"Link broken"}[f.linkStatus] || "Checked";
  return `<span><span class="dot ${esc(f.linkStatus)}"></span>${label} · checked ${a}</span>`;
}
function matches(f, skip){
  if (state.q){
    const hay = (f.name+" "+f.funder+" "+f.summary+" "+f.sectors.join(" ")+" "+f.regions.join(" ")+" "+f.funderType).toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  if (skip!=="sector" && state.sector.size && !f.sectors.some(s => state.sector.has(s))) return false;
  if (skip!=="region" && state.region.size && !(f.regions.includes("Nationwide") || f.regions.some(r => state.region.has(r)))) return false;
  if (skip!=="type" && state.type.size && !state.type.has(f.funderType)) return false;
  if (skip!=="when" && state.when.size && !state.when.has(whenOf(f))) return false;
  if (skip!=="who" && state.who.size && !f.eligible.some(e => state.who.has(e))) return false;
  return true;
}
function results(){
  let r = DATA.funds.filter(f => matches(f) && inTab(f, state.tab));
  if (state.sort === "deadline") r.sort((a,b) => (daysUntil(a.nextDeadline) ?? 9e9) - (daysUntil(b.nextDeadline) ?? 9e9));
  else if (state.sort === "az") r.sort((a,b) => a.name.localeCompare(b.name));
  else if (state.sort === "local") r.sort((a,b) => (a.regions.includes("Nationwide")) - (b.regions.includes("Nationwide")));
  return r;
}
function card(f){
  const d = daysUntil(f.nextDeadline);
  const when = d !== null && d >= 0
    ? `<span class="pill soon">Closes in ${d} day${d===1?"":"s"}</span>`
    : f.howToApply === "Open anytime" ? `<span class="pill anytime">Apply anytime</span>` : `<span class="pill">${esc(f.howToApply)}</span>`;
  const region = f.regions.includes("Nationwide") ? "Nationwide" : f.regions.slice(0,2).join(", ") + (f.regions.length>2 ? " +"+(f.regions.length-2) : "");
  const on = saved.has(f.id);
  return `<article class="card">
    <button type="button" class="save" data-save="${esc(f.id)}" aria-pressed="${on}" aria-label="${on?"Remove from saved":"Save"} ${esc(f.name)}">${on?"♥":"♡"}</button>
    <div class="meta"><span class="pill type">${esc(f.funderType)}</span>${when}</div>
    <h3><a href="#fund-${esc(f.id)}">${esc(f.name)}</a></h3>
    <div class="by">${esc(f.funder)}</div>
    <p>${esc(f.summary)}</p>
    <div class="meta">${f.sectors.slice(0,3).map(s=>`<span class="pill">${esc(s)}</span>`).join("")}<span class="pill">📍 ${esc(region)}</span></div>
    <div class="foot">${linkLine(f)}<span>${esc(f.amount)}</span></div>
  </article>`;
}
function chip(key, label, options){
  const set = state[key];
  const on = set.size>0;
  const menu = state.open === key ? `<div class="menu" role="group" aria-label="${esc(label)}">${options.map(o => {
      const n = DATA.funds.filter(f => matches(f, key) && (
        key==="sector" ? f.sectors.includes(o) : key==="region" ? (f.regions.includes(o) || f.regions.includes("Nationwide")) :
        key==="type" ? f.funderType===o : key==="who" ? f.eligible.includes(o) : whenOf(f)===o)).length;
      return `<label><input type="checkbox" data-k="${key}" value="${esc(o)}" ${set.has(o)?"checked":""}> ${esc(o)} <span class="n">${n}</span></label>`;
    }).join("")}</div>` : "";
  return `<div class="chip ${on?"on":""}"><button type="button" data-chip="${key}" aria-expanded="${state.open===key}">${esc(label)}${on?` <span class="count">${set.size}</span>`:""} <span aria-hidden="true">▾</span></button>${menu}</div>`;
}

}

  const ready = M.who && M.region && M.sector;
  let n = 0;
  if (ready) n = DATA.funds.filter(f => f.eligible.includes(M.who) && (f.regions.includes("Nationwide")||f.regions.includes(M.region)) && f.sectors.includes(M.sector)).length;
  app.innerHTML = `<section class="wrap page">

}

function route(){
  const h = location.hash.replace(/^#/,"") || "browse";
  const nav = h.startsWith("fund-") ? "browse" : h;
  if (h === "browse") state.tab = state.tab==="saved" ? "all" : state.tab;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav===nav ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  state.open = null;
  if (h.startsWith("fund-")) detail(h.slice(5));
  else if (h === "match") match();
  else if (h === "alerts") alerts();
  else if (h === "about") about();
  else if (h === "pricing") pricing();
  else if (h === "saved"){ state.tab="saved"; browse(); document.querySelector(".tabs")?.scrollIntoView({block:"start"}); }
  else browse();
}
function rerender(keepFocus){ browse(); if (keepFocus){ const el = document.querySelector(`[data-chip="${state.open}"]`); el && el.focus(); } }

app.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.save){ e.preventDefault(); saved.has(t.dataset.save)?saved.delete(t.dataset.save):saved.add(t.dataset.save); persistSaved(); if (location.hash.startsWith("#fund-")) detail(t.dataset.save); else rerender(); const b=document.querySelector(`[data-save="${CSS.escape(t.dataset.save)}"]`); b&&b.focus(); return; }
  if (t.dataset.tab){ state.tab=t.dataset.tab; rerender(); const b=document.querySelector(`[data-tab="${t.dataset.tab}"]`); b&&b.focus(); return; }
  if (t.dataset.sc){ state.sector.has(t.dataset.sc)?state.sector.delete(t.dataset.sc):state.sector.add(t.dataset.sc); rerender(); const b=document.querySelector(`[data-sc="${CSS.escape(t.dataset.sc)}"]`); b&&b.focus(); return; }
  if (t.dataset.chip){ state.open = state.open===t.dataset.chip ? null : t.dataset.chip; rerender(true); return; }
  if (t.dataset.rm){ state[t.dataset.rm].delete(t.dataset.v); rerender(); return; }
  if (t.id==="clear"||t.id==="clear2"){ ["sector","region","type","when","who"].forEach(k=>state[k].clear()); state.q=""; rerender(); return; }
  if (t.dataset.m){ M[t.dataset.m] = t.dataset.v; match(); return; }
  if (t.id==="showmatch"){ state.who=new Set([M.who]); state.region=new Set([M.region]); state.sector=new Set([M.sector]); location.hash="browse"; return; }
  if (t.dataset.follow){ follow = t.dataset.follow; }
  if (t.dataset.bill){ yearly = t.dataset.bill==="y"; pricing(); return; }
  if (t.dataset.plan){ chosen = t.dataset.plan; pricing(); const b=document.querySelector("[data-pay]"); b&&b.focus(); return; }
  if (t.id==="closesheet"){ chosen=null; pricing(); return; }
  if (t.dataset.pay){
    if (CONFIG.checkout){ CONFIG.checkout(chosen, yearly, t.dataset.pay); return; }
    const ok=document.getElementById("payok"); ok.textContent=`Preview only: no payment taken. On the live site this opens a secure ${t.dataset.pay==="card"?"card":t.dataset.pay} checkout.`; ok.hidden=false; return;
  }
  if (t.id==="report"){ document.getElementById("reported").hidden=false; t.hidden=true; }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.k){ t.checked ? state[t.dataset.k].add(t.value) : state[t.dataset.k].delete(t.value); state.open=t.dataset.k; rerender(); const m=document.querySelector(`.menu input[value="${CSS.escape(t.value)}"]`); m&&m.focus(); }
  if (t.id==="sort"){ state.sort=t.value; rerender(); }
});
app.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id==="sform"){
    state.q=document.getElementById("q").value.trim();
    const rg=document.getElementById("qr").value, wh=document.getElementById("qw").value;
    state.region=new Set(rg?[rg]:[]); state.who=new Set(wh?[wh]:[]);
    rerender(); document.querySelector(".tabs")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if (e.target.id==="subform"){
    const fd = new FormData(e.target);
    const email = String(fd.get("email")||"").trim();
    const err = document.getElementById("suberr");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent="Please enter a full email address, like name@example.org.nz."; err.hidden=false; return; }
    err.hidden=true;
    const tags = fd.getAll("tag"); const region = fd.get("region"); if (region) tags.push("Region: "+region); if (follow) tags.push("Fund: "+follow);
    const ok = document.getElementById("subok");
    if (CONFIG.buttondownUser){
      const body = new FormData(); body.append("email", email); tags.forEach(t=>body.append("tag", t));
      try { await fetch(`https://buttondown.com/api/emails/embed-subscribe/${encodeURIComponent(CONFIG.buttondownUser)}`, {method:"POST", body, mode:"no-cors"});
        ok.textContent = `Check ${email} for a confirmation email. Tap the link in it to start your alerts.`; }
      catch(_){ err.textContent="We couldn't reach the alerts service. Please try again in a minute."; err.hidden=false; return; }
    } else {
      ok.textContent = `Preview only: no email was sent. On the live site, ${email} would get a confirmation email and then weekly alerts${tags.length?` for ${tags.join(", ")}`:""}.`;
    }
    e.target.hidden = true; ok.hidden = false;
  }
});
document.addEventListener("click", e => { if (state.open && !e.target.closest(".chip")){ state.open=null; if (!location.hash || location.hash==="#browse") rerender(); } });
document.addEventListener("keydown", e => { if (e.key==="Escape" && chosen){ chosen=null; pricing(); return; } if (e.key==="Escape" && state.open){ const k=state.open; state.open=null; rerender(); const b=document.querySelector(`[data-chip="${k}"]`); b&&b.focus(); } });
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });

fetch("data/funds.json").then(r => r.json()).then(d => { DATA = d; route(); })
  .catch(() => { app.innerHTML = `<section class="wrap page"><h1>We couldn't load the fund list</h1><p>Refresh the page to try again.</p></section>`; });
})();
</script>
