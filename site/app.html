<title>Puna Pūtea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every New Zealand fund and grant in one free, searchable place, checked every night.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: white top bar; home = search band + two-column directory (filter sidebar + result rows); phones get a bottom tab bar and a filter sheet */
:root{
  --bg:#ffffff; --subtle:#f5f7fa; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6577; --faint:#8a93a3; --line:#e3e7ee; --line-strong:#cfd5df;
  --brand:#0b5d4b; --brand-hover:#094d3e; --brand-ink:#ffffff; --brand-soft:#e8f3ef;
  --amber:#a15c07; --amber-soft:#fff4e2; --ok:#16794a; --bad:#b42318; --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.06);
  --sans:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131c; --subtle:#121a25; --surface:#151e2a; --ink:#e8edf4; --muted:#a3aebd; --faint:#7d8898; --line:#253142; --line-strong:#33425a;
  --brand:#4fc2a4; --brand-hover:#6fd3b8; --brand-ink:#062019; --brand-soft:#15302a;
  --amber:#f2b04c; --amber-soft:#33270f; --ok:#5fd093; --bad:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131c; --subtle:#121a25; --surface:#151e2a; --ink:#e8edf4; --muted:#a3aebd; --faint:#7d8898; --line:#253142; --line-strong:#33425a;
  --brand:#4fc2a4; --brand-hover:#6fd3b8; --brand-ink:#062019; --brand-soft:#15302a;
  --amber:#f2b04c; --amber-soft:#33270f; --ok:#5fd093; --bad:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--brand)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance;line-height:1.2}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.label{font:500 .72rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:32px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
nav.main{display:flex;gap:2px;flex:1}
nav.main a{text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:6px;font-weight:500;font-size:.93rem}
nav.main a:hover{color:var(--ink);background:var(--subtle)}
nav.main a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand);border-radius:0}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:.93rem;border:1px solid transparent;border-radius:var(--r);padding:9px 16px;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--subtle)}
.btn.block{width:100%}

/* search band */
.band{background:var(--subtle);border-bottom:1px solid var(--line)}
.band .wrap{padding-block:44px 32px}
.band h1{font-size:clamp(1.8rem,3.6vw,2.6rem);max-width:22ch}
.band p.lede{color:var(--muted);max-width:60ch;margin:10px 0 0;font-size:1.05rem}
.seg{margin-top:24px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:6px;max-width:900px;box-shadow:var(--shadow)}
.seg label{display:grid;padding:6px 14px;border-right:1px solid var(--line);min-width:0;cursor:text}
.seg label:nth-child(3){border-right:0}
.seg label span{font:500 .68rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.seg input,.seg select{border:0;background:transparent;font:inherit;font-size:.98rem;color:var(--ink);padding:2px 0;min-width:0;width:100%}
.seg input:focus,.seg select:focus{outline:none}
.seg label:focus-within{background:var(--subtle);border-radius:8px}
.seg .btn{padding:0 22px;border-radius:8px}
.trust{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;color:var(--muted);font-size:.88rem;align-items:center}
.trust b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.trust .sep{width:4px;height:4px;border-radius:50%;background:var(--line-strong)}

/* directory layout */
.dir{display:grid;grid-template-columns:256px minmax(0,1fr);gap:40px;padding-block:28px 64px}
aside.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.fhead h2{font-size:1rem}
.linkbtn{font:inherit;font-size:.86rem;background:none;border:0;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.fgroup{border-top:1px solid var(--line);padding-block:14px}
.fgroup h3{font-size:.86rem;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.opt{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.92rem;cursor:pointer;color:var(--ink)}
.opt input{width:16px;height:16px;accent-color:var(--brand);margin:0;flex:none}
.opt .n{margin-left:auto;color:var(--faint);font-size:.8rem;font-variant-numeric:tabular-nums}
.opt.zero{color:var(--faint)}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-weight:500;font-size:.93rem;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 0;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .n{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--faint);margin-left:6px;background:var(--subtle);border-radius:999px;padding:1px 7px}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px}
.rhead .count{font-weight:600}
.rhead .count span{color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipx{font:inherit;font-size:.82rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 6px 3px 10px;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.chipx svg{width:14px;height:14px}
.sort{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}
.sort select{font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px}
.fbtn{display:none}

.rows{display:grid;gap:12px}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;transition:border-color .15s, box-shadow .15s}
.row:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.row .top-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-right:40px}
.row h3{font-size:1.06rem;margin-top:6px}
.row h3 a{color:var(--ink);text-decoration:none}
.row h3 a::after{content:"";position:absolute;inset:0;border-radius:10px}
.row h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.row .by{color:var(--muted);font-size:.9rem;margin-top:2px}
.row p{margin:8px 0 0;font-size:.92rem;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:.78rem;border-radius:4px;padding:2px 8px;background:var(--subtle);color:var(--muted);white-space:nowrap}
.status{font-size:.78rem;font-weight:600;border-radius:4px;padding:2px 8px;white-space:nowrap}
.status.anytime{background:var(--brand-soft);color:var(--brand)}
.status.soon{background:var(--amber-soft);color:var(--amber)}
.status.rounds{background:var(--subtle);color:var(--muted)}
.side{border-left:1px solid var(--line);padding-left:20px;display:grid;gap:10px;align-content:start;font-size:.86rem}
.side dt{color:var(--faint);font-size:.74rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.side dd{margin:0;color:var(--ink);font-weight:500}
.health{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.moved{background:var(--amber)} .dot.broken,.dot.blocked{background:var(--bad)}
.save{position:absolute;top:14px;right:14px;z-index:1;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.save:hover{background:var(--subtle);color:var(--ink)}
.save[aria-pressed="true"]{color:var(--brand)}
.save[aria-pressed="true"] svg{fill:currentColor}
.empty{background:var(--subtle);border:1px dashed var(--line-strong);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:4px}

/* pages */
.page{padding-block:40px 72px;max-width:760px}
.page h1{font-size:clamp(1.6rem,3vw,2.2rem);margin-top:6px}
.page p{max-width:65ch;color:var(--muted)}
.crumbs{font-size:.86rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:16px}
.crumbs a{color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;padding-block:32px 72px}
.detail h1{font-size:clamp(1.6rem,3vw,2.2rem);margin-top:10px}
.detail .lead{font-size:1.06rem;max-width:62ch;margin-top:14px}
.facts{display:grid;grid-template-columns:170px minmax(0,1fr);border-top:1px solid var(--line);margin-top:28px}
.facts dt,.facts dd{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.facts dt{color:var(--muted);font-size:.9rem}
.panel{border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);background:var(--surface);box-shadow:var(--shadow)}
.note{font-size:.84rem;color:var(--muted);background:var(--subtle);border-radius:8px;padding:10px 12px}
.history{margin-top:28px}
.history h2{font-size:1.05rem;margin-bottom:8px}
.history ul{padding-left:18px;color:var(--muted)}

.steps{display:grid;gap:28px;margin-top:28px}
.step h2{font-size:1rem;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.step h2 .num{font:500 .75rem var(--mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--subtle);color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{font:inherit;font-size:.92rem;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:8px 14px;cursor:pointer}
.choice:hover{border-color:var(--ink)}
.choice[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.small{font-size:.82rem;color:var(--muted);margin:0}
.compare{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:16px}
.compare th,.compare td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.compare th{font-weight:600}
.compare td.y{color:var(--ok);font-weight:600}
.tablewrap{overflow-x:auto}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,18,30,.55);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet>.box{background:var(--surface);color:var(--ink);border-radius:14px;padding:24px;max-width:440px;width:100%;display:grid;gap:12px;box-shadow:0 24px 64px rgba(0,0,0,.3);max-height:100%;overflow:auto}

footer.site{border-top:1px solid var(--line);background:var(--subtle)}
footer.site .wrap{padding-block:28px;display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.tabbar{display:none}
.sheet-actions{display:flex;gap:8px;position:sticky;bottom:calc(-1 * (20px + env(safe-area-inset-bottom,0px)));background:var(--surface);padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-1 * (20px + env(safe-area-inset-bottom,0px)));border-top:1px solid var(--line)}
.freebadge{font-size:.82rem;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:5px 12px;white-space:nowrap}
.feed{display:grid;gap:0;margin-top:24px;border-top:1px solid var(--line)}
.feed .ev{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.feed .ev time{color:var(--faint);font:500 .78rem var(--mono);padding-top:3px}
.feed .ev a{font-weight:600;color:var(--ink)}
.feed .ev p{margin:2px 0 0;color:var(--muted);font-size:.92rem}

@media (max-width:980px){
  .dir{grid-template-columns:1fr;gap:0}
  aside.filters{display:none}
  .fbtn{display:inline-flex}
  .detail{grid-template-columns:1fr;gap:28px}
  .panel{position:static}
}
@media (max-width:760px){
  .top .wrap{height:56px}
  nav.main{display:none}
  .feed .ev{grid-template-columns:1fr;gap:2px}
  .top-actions{margin-left:auto}
  .band .wrap{padding-block:28px 24px}
  .seg{grid-template-columns:1fr 1fr}
  .seg label:first-child{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
  .seg label:nth-child(2){border-right:1px solid var(--line)}
  .seg .btn{grid-column:1/-1;margin-top:6px;padding:12px}
  .row{grid-template-columns:1fr;gap:12px;padding:16px}
  .side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px;grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
  .facts dt{border-bottom:0;padding-bottom:0}
  .sort span{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:grid;justify-items:center;gap:3px;text-decoration:none;color:var(--faint);font-size:.7rem;font-weight:500;padding:4px 0}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--brand)}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .sheet{align-items:flex-end;padding-bottom:0}
  .sheet>.box{border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.row{transition:none}}
</style>

<script>
(function(){
const SECTORS = ["Community","Arts & culture","Sport & recreation","Environment","Māori & iwi","Education & youth","Health & wellbeing","Business & innovation","Heritage","Media"];
const REGIONS = ["Northland","Auckland","Waikato","Bay of Plenty","Gisborne","Hawke's Bay","Taranaki","Manawatū-Whanganui","Wellington","Tasman","Nelson","Marlborough","West Coast","Canterbury","Otago","Southland","Chatham Islands"];
const TYPES = ["Government","Gaming trust","Community trust","Philanthropic","Council","Corporate"];
const WHEN = ["Open anytime","Set rounds","Closing in 30 days","Check funder"];
const WHO = ["Community groups","Charities","Marae, iwi & hapū","Schools","Businesses","Individuals"];
const GROUPS = [["sector","Kaupapa / sector",SECTORS],["region","Region",REGIONS],["type","Funder type",TYPES],["when","When to apply",WHEN],["who","Who can apply",WHO]];
const KEYS = GROUPS.map(g=>g[0]);
const TABS = [["all","All funds"],["anytime","Apply anytime"],["soon","Closing soon"],["changed","Recently changed"],["saved","Saved"]];
const icon = (n, cls="i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

let DATA = {updated:null, funds:[]};
const state = { tab:"all", q:"", sector:new Set(), region:new Set(), type:new Set(), when:new Set(), who:new Set(), sort:"relevance", more:new Set(), sheet:false };
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("puna-saved") || "[]")); } catch(_) {}
const persistSaved = () => { try { localStorage.setItem("puna-saved", JSON.stringify([...saved])); } catch(_) {} };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function daysUntil(d){ if(!d) return null; return Math.ceil((new Date(d+"T23:59:59+13:00") - Date.now())/864e5); }
function whenOf(f){ const d = daysUntil(f.nextDeadline); return (d !== null && d >= 0 && d <= 30) ? "Closing in 30 days" : f.howToApply; }
function ago(iso){
  if(!iso) return null;
  const h = Math.round((Date.now() - new Date(iso))/36e5);
  if (h < 1) return "just now"; if (h < 24) return h+"h ago";
  const d = Math.round(h/24); return d === 1 ? "yesterday" : d+" days ago";
}
function health(f){
  const a = ago(f.lastChecked);
  if (!a) return `<span class="health"><span class="dot"></span>First check pending</span>`;
  const label = {ok:"Link verified", moved:"Page moved", broken:"Link broken", blocked:"Needs manual check"}[f.linkStatus] || "Checked";
  return `<span class="health"><span class="dot ${esc(f.linkStatus)}"></span>${label} · ${a}</span>`;
}
function recent(f){ const h=(f.history||[]).at(-1); return !!h && (Date.now()-new Date(h.date))/864e5 <= 14; }
function inTab(f, tab){
  if (tab==="anytime") return f.howToApply==="Open anytime";
  if (tab==="soon"){ const d=daysUntil(f.nextDeadline); return d!==null && d>=0 && d<=45; }
  if (tab==="changed") return recent(f);
  if (tab==="saved") return saved.has(f.id);
  return true;
}
function hasOpt(f, key, o){
  return key==="sector" ? f.sectors.includes(o) : key==="region" ? (f.regions.includes(o) || f.regions.includes("Nationwide")) :
    key==="type" ? f.funderType===o : key==="who" ? f.eligible.includes(o) : whenOf(f)===o;
}
function matches(f, skip){
  if (state.q){
    const hay = (f.name+" "+f.funder+" "+f.summary+" "+f.sectors.join(" ")+" "+f.regions.join(" ")+" "+f.funderType+" "+f.eligible.join(" ")).toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  for (const k of KEYS){ if (k!==skip && state[k].size && ![...state[k]].some(o => hasOpt(f,k,o))) return false; }
  return true;
}
function results(){
  const r = DATA.funds.filter(f => matches(f) && inTab(f, state.tab));
  if (state.sort === "deadline") r.sort((a,b) => (daysUntil(a.nextDeadline) ?? 9e9) - (daysUntil(b.nextDeadline) ?? 9e9));
  else if (state.sort === "az") r.sort((a,b) => a.name.localeCompare(b.name));
  else if (state.sort === "local") r.sort((a,b) => (a.regions.includes("Nationwide")) - (b.regions.includes("Nationwide")));
  return r;
}
function statusOf(f){
  const d = daysUntil(f.nextDeadline);
  if (d !== null && d >= 0) return `<span class="status soon">Closes in ${d} day${d===1?"":"s"}</span>`;
  if (f.howToApply === "Open anytime") return `<span class="status anytime">Apply anytime</span>`;
  return `<span class="status rounds">${esc(f.howToApply)}</span>`;
}
function regionText(f){ return f.regions.includes("Nationwide") ? "Nationwide" : f.regions.slice(0,2).join(", ") + (f.regions.length>2 ? " +"+(f.regions.length-2) : ""); }
function row(f){
  const on = saved.has(f.id);
  return `<article class="row">
    <div style="min-width:0">
      <div class="top-line"><span class="label">${esc(f.funderType)}</span>${statusOf(f)}</div>
      <h3><a href="#fund-${esc(f.id)}">${esc(f.name)}</a></h3>
      <div class="by">${esc(f.funder)}</div>
      <p>${esc(f.summary)}</p>
      <div class="tags">${f.sectors.slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>
    </div>
    <dl class="side">
      <div><dt>Region</dt><dd>${esc(regionText(f))}</dd></div>
      <div><dt>Amount</dt><dd>${esc(f.amount)}</dd></div>
      <div style="grid-column:1/-1">${health(f)}</div>
    </dl>
    <button type="button" class="save" data-save="${esc(f.id)}" aria-pressed="${on}" aria-label="${on?"Remove":"Save"} ${esc(f.name)}" title="${on?"Saved":"Save"}">${icon("bookmark")}</button>
  </article>`;
}
function filterGroups(){
  return GROUPS.map(([key,label,opts]) => {
    const counted = opts.map(o => [o, DATA.funds.filter(f => matches(f,key) && inTab(f,state.tab) && hasOpt(f,key,o)).length]);
    const limit = state.more.has(key) ? opts.length : 6;
    const shown = counted.slice(0, limit);
    return `<div class="fgroup"><h3>${esc(label)}${state[key].size?`<button class="linkbtn" data-clr="${key}">Clear</button>`:""}</h3>
      ${shown.map(([o,n]) => `<label class="opt ${n?"":"zero"}"><input type="checkbox" data-k="${key}" value="${esc(o)}" ${state[key].has(o)?"checked":""}> ${esc(o)}<span class="n">${n}</span></label>`).join("")}
      ${opts.length>6?`<button class="linkbtn" data-more="${key}">${state.more.has(key)?"Show fewer":`Show all ${opts.length}`}</button>`:""}
    </div>`;
  }).join("");
}
const activeCount = () => KEYS.reduce((n,k)=>n+state[k].size,0);
function browse(){
  const r = results();
  const funders = new Set(DATA.funds.map(f=>f.funder)).size;
  const applied = [];
  KEYS.forEach(k => state[k].forEach(v => applied.push(`<button class="chipx" data-rm="${k}" data-v="${esc(v)}" aria-label="Remove ${esc(v)}">${esc(v)}${icon("x")}</button>`)));
  if (state.q) applied.unshift(`<button class="chipx" data-rmq="1" aria-label="Remove search">“${esc(state.q)}”${icon("x")}</button>`);
  app.innerHTML = `
  <section class="band"><div class="wrap">
    <div class="label">Ngā pūtea katoa · All funding in Aotearoa</div>
    <h1 style="margin-top:8px">Every New Zealand fund, in one place.</h1>
    <p class="lede">Search grants from government, gaming trusts, community trusts, councils and philanthropy. Free, no login, and every listing is re-checked each night.</p>
    <form class="seg" role="search" id="sform">
      <label for="q"><span>What's it for?</span><input id="q" type="search" placeholder="e.g. marae kitchen, netball uniforms" value="${esc(state.q)}"></label>
      <label for="qr"><span>Where</span><select id="qr"><option value="">All of Aotearoa</option>${REGIONS.map(x=>`<option ${state.region.size===1&&state.region.has(x)?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
      <label for="qw"><span>Who's applying</span><select id="qw"><option value="">Anyone</option>${WHO.map(x=>`<option ${state.who.size===1&&state.who.has(x)?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
      <button class="btn" type="submit">${icon("search")} Search</button>
    </form>
    <div class="trust"><span><b>${DATA.funds.length}</b> funds</span><span class="sep"></span><span><b>${funders}</b> funders</span><span class="sep"></span><span>${DATA.updated ? `Last checked <b>${esc(ago(DATA.updated))}</b>` : "Checked <b>every night</b>"}</span><span class="sep"></span><span>Government · Gaming trusts · Community trusts · Councils · Philanthropy · Corporate</span></div>
  </div></section>
  <section class="wrap dir">
    <aside class="filters" aria-label="Filters">
      <div class="fhead"><h2>Filters</h2>${activeCount()?`<button class="linkbtn" id="clear">Clear all</button>`:""}</div>
      ${filterGroups()}
    </aside>
    <div style="min-width:0">
      <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}<span class="n">${DATA.funds.filter(f=>matches(f)&&inTab(f,k)).length}</span></button>`).join("")}</div>
      <div class="rhead">
        <button class="btn ghost fbtn" id="openfilters">${icon("filter")} Filters${activeCount()?` (${activeCount()})`:""}</button>
        <div class="count">${r.length} <span>of ${DATA.funds.length} funds</span></div>
        <div class="chips">${applied.join("")}</div>
        <label class="sort" for="sort"><span>Sort by</span><select id="sort">
          <option value="relevance" ${state.sort==="relevance"?"selected":""}>Best match</option>
          <option value="deadline" ${state.sort==="deadline"?"selected":""}>Closing soonest</option>
          <option value="local" ${state.sort==="local"?"selected":""}>Local funders first</option>
          <option value="az" ${state.sort==="az"?"selected":""}>A to Z</option>
        </select></label>
      </div>
      <div class="rows">${r.length ? r.map(row).join("") : emptyFor()}</div>
    </div>
  </section>
  ${state.sheet ? `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fsh"><div class="box">
      <div class="fhead"><h2 id="fsh">Filters</h2><button class="linkbtn" id="closesheet">Close</button></div>
      ${filterGroups()}
      <div class="sheet-actions"><button class="btn ghost" id="clear" style="flex:1">Clear all</button><button class="btn" id="applysheet" style="flex:2">Show ${r.length} fund${r.length===1?"":"s"}</button></div>
    </div></div>` : ""}`;
}
function emptyFor(){
  if (state.tab==="changed") return `<div class="empty"><b>No changes in the last two weeks yet</b>After each nightly check, funds with new rounds, closing dates or moved pages appear here.</div>`;
  if (state.tab==="saved") return `<div class="empty"><b>No saved funds yet</b>Use the bookmark on any fund to keep it here on this device.</div>`;
  return `<div class="empty"><b>No funds match all of these filters</b>Try removing one, or <button class="linkbtn" id="clear">clear all filters</button>.</div>`;
}
function detail(id){
  const f = DATA.funds.find(x => x.id === id);
  if (!f){ app.innerHTML = `<section class="wrap page"><h1>We couldn't find that fund</h1><p><a href="#browse">Back to all funds</a></p></section>`; return; }
  const d = daysUntil(f.nextDeadline);
  const changes = (f.history||[]).slice(-6).reverse();
  const on = saved.has(f.id);
  app.innerHTML = `<section class="wrap detail">
    <div style="min-width:0">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#browse">Find funding</a>${icon("chev")}<span>${esc(f.funderType)}</span></nav>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="label">${esc(f.funder)}</span>${statusOf(f)}</div>
      <h1>${esc(f.name)}</h1>
      <p class="lead">${esc(f.summary)}</p>
      <dl class="facts">
        <dt>Kaupapa / sector</dt><dd>${f.sectors.map(esc).join(", ")}</dd>
        <dt>Region</dt><dd>${f.regions.map(esc).join(", ")}</dd>
        <dt>Who can apply</dt><dd>${f.eligible.map(esc).join(", ")}</dd>
        <dt>How to apply</dt><dd>${esc(f.howToApply)}</dd>
        <dt>Next closing date</dt><dd>${f.nextDeadline ? esc(new Date(f.nextDeadline).toLocaleDateString("en-NZ",{day:"numeric",month:"long",year:"numeric"})) + (d>=0?` (in ${d} days)`:" (passed)") : "Not published yet. It will show here as soon as our nightly check finds one."}</dd>
        <dt>Typical amount</dt><dd>${esc(f.amount)}</dd>
        <dt>Link status</dt><dd>${health(f)}</dd>
      </dl>
      <div class="history"><h2>Change history</h2>
        ${changes.length ? `<ul>${changes.map(c=>`<li>${esc(c.date)}: ${esc(c.text)}</li>`).join("")}</ul>` : `<p class="small">No changes recorded yet. Every change our nightly check finds on the funder's page is logged here.</p>`}</div>
    </div>
    <aside class="panel">
      <a class="btn block" href="${esc(f.url)}" target="_blank" rel="noopener">Open funder's page ${icon("ext")}</a>
      <button type="button" class="btn ghost block" data-save="${esc(f.id)}" aria-pressed="${on}">${icon("bookmark")} ${on?"Saved":"Save this fund"}</button>
      <div class="note">Always confirm dates and criteria on the funder's own page before you apply.</div>
      <button class="linkbtn" style="justify-self:start" id="report">Report a problem with this listing</button>
      <p id="reported" hidden class="small">Thanks. On the live site this goes to the editor's review queue.</p>
    </aside>
  </section>`;
}
const M = { who:null, region:null, sector:null };
function match(){
  const opt = (k, list) => `<div class="choices">${list.map(o=>`<button type="button" class="choice" data-m="${k}" data-v="${esc(o)}" aria-pressed="${M[k]===o}">${esc(o)}</button>`).join("")}</div>`;
  const ready = M.who && M.region && M.sector;
  const n = ready ? DATA.funds.filter(f => f.eligible.includes(M.who) && (f.regions.includes("Nationwide")||f.regions.includes(M.region)) && f.sectors.includes(M.sector)).length : 0;
  app.innerHTML = `<section class="wrap page">
    <div class="label">Eligibility match</div>
    <h1>Find the funds you're most likely eligible for.</h1>
    <p>Answer three questions. We'll shortlist funds that accept applicants like you, in your region, for your kaupapa.</p>
    <div class="steps">
      <div class="step"><h2><span class="num">1</span>Who is applying?</h2>${opt("who",WHO)}</div>
      <div class="step"><h2><span class="num">2</span>Where are you based?</h2>${opt("region",REGIONS)}</div>
      <div class="step"><h2><span class="num">3</span>What is the funding for?</h2>${opt("sector",SECTORS)}</div>
    </div>
    <p style="margin-top:28px">${ready ? `<button class="btn" id="showmatch">See your ${n} matching fund${n===1?"":"s"}</button>` : `<span class="small">Choose one answer for each question.</span>`}</p>
  </section>`;
}
let CHANGES = null;
const KIND = {new_date:"New closing date", round_open:"Round open", page_changed:"Page updated", link_moved:"Page moved", link_broken:"Link broken", link_ok:"Link fixed", link_blocked:"Needs a manual check"};
function updates(){
  if (CHANGES === null){
    app.innerHTML = `<section class="wrap page"><p class="small">Loading changes…</p></section>`;
    fetch("data/changes.json").then(r => r.ok ? r.json() : []).catch(() => []).then(c => { CHANGES = Array.isArray(c) ? c : []; if ((location.hash||"")==="#updates") updates(); });
    return;
  }
  const ev = CHANGES.filter(c => c.kind !== "link_blocked").slice(-60).reverse();
  app.innerHTML = `<section class="wrap page">
    <div class="label">What's changed</div>
    <h1>Every change our nightly check found.</h1>
    <p>New rounds, new closing dates, updated pages and moved links, newest first. Nothing to sign up for.</p>
    <p><a class="btn ghost" href="feed.xml">${icon("rss")} Follow in a news reader (RSS)</a></p>
    ${ev.length ? `<div class="feed">${ev.map(c => `<div class="ev"><time datetime="${esc(c.date)}">${esc(new Date(c.date).toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"}))}</time><div><a href="#fund-${esc(c.fund)}">${esc(c.name)}</a><p>${esc(KIND[c.kind]||"Update")}: ${esc(c.text)}</p></div></div>`).join("")}</div>`
      : `<div class="empty" style="margin-top:24px"><b>No changes recorded yet</b>The first nightly check is running. Changes it finds will appear here.</div>`}
  </section>`;
}
function about(){
  app.innerHTML = `<section class="wrap page">
    <div class="label">How it works</div>
    <h1>A funding directory that keeps itself up to date.</h1>
    <p>Every night an automated checker visits each funder's page and looks for four things:</p>
    <dl class="facts" style="margin-top:16px">
      <dt>Broken or moved links</dt><dd>So you never click through to a dead page.</dd>
      <dt>Page changes</dt><dd>So we know when criteria or forms are updated.</dd>
      <dt>Closing dates</dt><dd>Picked out of the page text and shown on each fund.</dd>
      <dt>Open or closed wording</dt><dd>Such as “applications are now open”.</dd>
    </dl>
    <p style="margin-top:20px">Everything it finds is listed on <a href="#updates">What's changed</a> and in an RSS feed. The site is free for everyone, with no login and no adverts.</p>
    <h2 style="font-size:1.15rem;margin-top:36px">How this compares</h2>
    <div class="tablewrap"><table class="compare">
      <thead><tr><th></th><th>Puna Pūtea</th><th>Library and council databases</th><th>Single-funder sites</th></tr></thead>
      <tbody>
        <tr><td>Free, no login</td><td class="y">Yes</td><td>Library or council login</td><td>Yes</td></tr>
        <tr><td>All sectors and funder types</td><td class="y">Yes</td><td>Mostly</td><td>One funder</td></tr>
        <tr><td>Shows when each listing was last checked</td><td class="y">Yes, nightly</td><td>No</td><td>No</td></tr>
        <tr><td>Public log of every change</td><td class="y">Yes</td><td>No</td><td>Rarely</td></tr>
        <tr><td>Three-question eligibility match</td><td class="y">Yes</td><td>Filters only</td><td>No</td></tr>
      </tbody></table></div>
  </section>`;
}
function route(){
  const h = location.hash.replace(/^#/,"") || "browse";
  const nav = h.startsWith("fund-") ? "browse" : h;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav===nav ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  state.sheet = false;
  if (h.startsWith("fund-")) detail(h.slice(5));
  else if (h === "match") match();
  else if (h === "updates") updates();
  else if (h === "about") about();
  else if (h === "saved"){ state.tab="saved"; browse(); }
  else { if (state.tab==="saved") state.tab="all"; browse(); }
}
function refocus(sel){ const el = document.querySelector(sel); el && el.focus({preventScroll:true}); }

app.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.save){ e.preventDefault(); const id=t.dataset.save; saved.has(id)?saved.delete(id):saved.add(id); persistSaved(); location.hash.startsWith("#fund-") ? detail(id) : browse(); refocus(`[data-save="${CSS.escape(id)}"]`); return; }
  if (t.dataset.tab){ state.tab=t.dataset.tab; browse(); refocus(`[data-tab="${t.dataset.tab}"]`); return; }
  if (t.dataset.rm){ state[t.dataset.rm].delete(t.dataset.v); browse(); return; }
  if (t.dataset.rmq){ state.q=""; browse(); return; }
  if (t.dataset.clr){ state[t.dataset.clr].clear(); browse(); return; }
  if (t.dataset.more){ const k=t.dataset.more; state.more.has(k)?state.more.delete(k):state.more.add(k); browse(); refocus(`${state.sheet?".sheet ":"aside "}[data-more="${k}"]`); return; }
  if (t.id==="clear"){ KEYS.forEach(k=>state[k].clear()); state.q=""; browse(); return; }
  if (t.id==="openfilters"){ state.sheet=true; browse(); refocus("#closesheet"); return; }
  if (t.id==="closesheet"||t.id==="applysheet"){ state.sheet=false; browse(); refocus("#openfilters"); return; }
  if (t.dataset.m){ M[t.dataset.m] = t.dataset.v; match(); refocus(`[data-m="${t.dataset.m}"][data-v="${CSS.escape(t.dataset.v)}"]`); return; }
  if (t.id==="showmatch"){ state.who=new Set([M.who]); state.region=new Set([M.region]); state.sector=new Set([M.sector]); state.tab="all"; location.hash="browse"; return; }
  if (t.id==="report"){ document.getElementById("reported").hidden=false; t.hidden=true; }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.k){ t.checked ? state[t.dataset.k].add(t.value) : state[t.dataset.k].delete(t.value); browse(); refocus(`${state.sheet?".sheet ":"aside "}input[data-k="${t.dataset.k}"][value="${CSS.escape(t.value)}"]`); }
  if (t.id==="sort"){ state.sort=t.value; browse(); refocus("#sort"); }
});
app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id==="sform"){
    state.q=document.getElementById("q").value.trim();
    const rg=document.getElementById("qr").value, wh=document.getElementById("qw").value;
    state.region=new Set(rg?[rg]:[]); state.who=new Set(wh?[wh]:[]);
    browse(); document.querySelector(".tabs")?.scrollIntoView({behavior:"smooth",block:"start"}); return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key!=="Escape") return;
  if (state.sheet){ state.sheet=false; browse(); refocus("#openfilters"); }
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });

fetch("data/funds.json").then(r => r.json()).then(d => { DATA = d; route(); })
  .catch(() => { app.innerHTML = `<section class="wrap page"><h1>We couldn't load the fund list</h1><p>Refresh the page to try again.</p></section>`; });
})();
</script>
